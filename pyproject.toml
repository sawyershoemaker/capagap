[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "capagap"
dynamic = ["version"]
description = "Measure malware capability coverage across static analysis and labeled sandbox runs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Sawyer Shoemaker" },
]
keywords = ["malware-analysis", "reverse-engineering", "capa", "sandbox", "dfir"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/sawyershoemaker/capagap"
Issues = "https://github.com/sawyershoemaker/capagap/issues"
Documentation = "https://github.com/sawyershoemaker/capagap/blob/main/docs/CLI.md"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12", "twine>=6.1"]

[project.scripts]
capagap = "capagap.cli:main"

[tool.setuptools.dynamic]
version = { attr = "capagap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["capagap*"]

[tool.setuptools.package-data]
capagap = ["importers/*.tmpl", "assets/*.css", "assets/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["build", "dist", "examples/re-handoff"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
